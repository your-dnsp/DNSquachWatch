name: DNSquachWatch bug report
description: Report a problem with DNSP's modified firmware.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report DNSP custom-firmware bugs here, not to the original creator. Never paste PINs, passwords, PRIVATE research exports or raw identifying logs.
        A solid white screen may indicate the other CYD display controller or an unstable 80 MHz display clock. Use the matching ST7789/ILI9341 kit; System can switch to 40 MHz once the screen works. See docs/user/INSTALLATION.md for recovery. Do not erase flash unless you intend to delete stored security state and settings.
  - type: dropdown
    id: display
    attributes:
      label: Display kit
      options:
        - ST7789-80MHz
        - ILI9341-80MHz
        - Unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DNSP firmware version
      placeholder: v1.5
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened and how can it be repeated?
      description: Include expected behavior, microSD presence/content version, display clock setting, and the actions before the problem. Review screenshots for private information.
    validations:
      required: true
  - type: textarea
    id: crash
    attributes:
      label: Optional crash summary
      description: Redact personal data. A LAST CRASH task/address summary is helpful; do not upload raw logs or backups.
